<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Agenda</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --onyx: #14090A;
    --onyx-2: #000000;
    --ivory: #F4EEE5;
    --card: #FFFFFF;
    --line: #E7DFD3;
    --gold: #5A1620;
    --gold-soft: #EEDCDA;
    --rose: #14090A;
    --rose-soft: #ECECEC;
    --taupe: #6E6259;
    --ok: #2ECC71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--gold);
    color: #FFFFFF;
    font-family: 'Poppins', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 720px; margin: 0 auto; padding: 0 20px 80px; }

  .hero {
    background: var(--gold);
    padding: 34px 20px 30px;
    text-align: center;
    position: relative;
  }
  .hero .status-pill {
    position: absolute; top: 18px; right: 20px;
    font-size: 11px; color: #FFFFFF;
  }
  .hero .ig {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #FFFFFF;
    text-decoration: none;
    background: rgba(255,255,255,0.14);
    padding: 5px 12px;
    border-radius: 999px;
  }
  .hero .ig:hover { background: rgba(255,255,255,0.24); }
  .hero .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 34px;
    color: #F4EEE5;
    margin: 14px 0 0;
    letter-spacing: 0.01em;
  }
  .hero .wordmark em { font-style: normal; color: #FFFFFF; text-transform: uppercase; font-weight: 900; }
  .hero .rule {
    width: 40px; height: 3px; background: #E8B8B0;
    border-radius: 2px;
    margin: 14px auto 12px;
  }
  .hero .tagline {
    margin: 0; font-size: 11px; letter-spacing: 0.2em; font-weight: 600;
    text-transform: uppercase; color: rgba(244,238,229,0.75);
  }

  .status-pill { display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.4); }
  .dot.on { background: #E8B8B0; box-shadow: 0 0 0 3px rgba(232,184,176,0.28); }

  .content { padding-top: 26px; }

  /* --- Connect screen --- */
  .connect-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 44px 32px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(90,22,32,0.10);
  }
  .connect-card .mirror {
    width: 52px; height: 68px;
    margin: 0 auto 20px;
    border: 2px solid var(--gold);
    border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
    position: relative;
  }
  .connect-card .mirror::after {
    content: '';
    position: absolute;
    bottom: -13px; left: 50%;
    transform: translateX(-50%);
    width: 3px; height: 13px;
    background: var(--gold);
  }
  .connect-card p { color: var(--taupe); font-size: 14px; line-height: 1.7; max-width: 380px; margin: 0 auto 24px; }
  button {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.01em;
    border: none;
    border-radius: 999px;
    padding: 13px 24px;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--gold); color: #FFFFFF; box-shadow: 0 4px 12px rgba(90,22,32,0.35); }
  .btn-primary:hover { background: var(--onyx-2); }
  .btn-ghost { background: transparent; color: var(--rose); border: 1.5px solid var(--rose-soft); }
  .btn-ghost:hover { background: var(--rose-soft); }
  .btn-danger { background: transparent; color: #A94442; font-size: 12px; padding: 6px 10px; }

  /* --- Layout once connected --- */
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .toolbar h2 {
    font-family: 'Fraunces', serif; font-size: 21px; margin: 0; font-weight: 700;
    letter-spacing: -0.01em; color: #FFFFFF;
  }

  .day-group { margin-bottom: 24px; }
  .day-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #F4D9D5;
    font-weight: 700;
    margin-bottom: 9px;
    padding-left: 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .day-label::after { content: ''; flex: 1; height: 2px; background: rgba(255,255,255,0.25); border-radius: 2px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--accent, var(--gold));
    border-radius: 14px;
    padding: 16px 16px 14px;
    margin-bottom: 10px;
    box-shadow: 0 2px 10px rgba(13,13,13,0.08);
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card .who { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 700; margin: 0; color: var(--onyx); }
  .card .svc-tag {
    display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 3px 10px; border-radius: 999px; margin-top: 6px;
    background: var(--accent, var(--gold)); color: #FFFFFF; opacity: 0.92;
  }
  .card .actions { display: flex; gap: 2px; flex-shrink: 0; }
  .meta-list { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
  .meta-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--onyx); }
  .meta-row svg { flex-shrink: 0; color: var(--gold); }
  .meta-row.muted { color: var(--taupe); }
  .swatch { display: none; }
  .card .time { font-weight: 600; }
  .card .svc { display: none; }
  .icon-btn {
    background: transparent; border: none; cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-size: 12px; font-weight: 500; color: var(--taupe); padding: 6px 8px; border-radius: 8px;
  }
  .icon-btn:hover { background: var(--ivory); color: var(--onyx); }

  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }

  .day-nav { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 14px; }
  .icon-btn.nav {
    background: rgba(255,255,255,0.12); color: #FFFFFF; border-radius: 50%;
    width: 30px; height: 30px; font-size: 16px; line-height: 1; padding: 0;
  }
  .icon-btn.nav:hover { background: rgba(255,255,255,0.22); }
  .day-nav .day-label {
    font-family: 'Fraunces', serif; font-size: 16px; font-weight: 700; color: #FFFFFF;
    text-transform: capitalize; min-width: 190px; text-align: center;
  }

  .timeline-grid {
    position: relative; background: var(--card); border-radius: 14px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(13,13,13,0.08);
  }
  .tl-hourline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .tl-hourline.half { border-top-style: dashed; opacity: 0.6; }
  .tl-hourlabel {
    position: absolute; left: 10px; font-size: 10.5px; color: var(--taupe); font-weight: 600;
    transform: translateY(-50%); background: var(--card); padding-right: 6px;
  }
  .tl-block {
    position: absolute; left: 66px; right: 10px; border-radius: 8px; padding: 5px 10px;
    color: #FFFFFF; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.18); cursor: pointer;
  }
  .tl-block .tb-time { font-size: 10px; font-weight: 700; opacity: 0.9; }
  .tl-block .tb-name { font-size: 13px; font-weight: 700; font-family: 'Fraunces', serif; line-height: 1.15; }
  .tl-block .tb-svc { font-size: 10px; opacity: 0.85; }
  .tl-empty { text-align: center; color: rgba(255,255,255,0.7); font-size: 13px; padding: 30px 0; }

  .week-outer { display: flex; background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(13,13,13,0.08); }
  .week-gutter { width: 52px; flex-shrink: 0; position: relative; border-right: 1px solid var(--line); }
  .week-scroll { flex: 1; overflow-x: auto; }
  .week-grid { display: flex; min-width: 820px; }
  .week-col { flex: 1; min-width: 116px; position: relative; border-left: 1px solid var(--line); }
  .week-col:first-child { border-left: none; }
  .week-col-header {
    text-align: center; padding: 10px 2px; border-bottom: 1px solid var(--line);
    font-size: 11px; color: var(--taupe); font-weight: 700; text-transform: uppercase;
  }
  .week-col-header .wn { display: block; font-family: 'Fraunces', serif; font-size: 20px; color: var(--onyx); font-weight: 700; text-transform: none; margin-top: 3px; }
  .week-col-header.today { background: var(--gold-soft); }
  .week-col-header.today .wn { color: var(--gold); }
  .week-body { position: relative; }
  .wk-block {
    position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 4px 6px;
    color: #FFFFFF; overflow: hidden; font-size: 11px; line-height: 1.25; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .wk-block b { display: block; font-size: 12.5px; font-family: 'Fraunces', serif; }
  .now-line { position: absolute; left: 0; right: 0; height: 2px; background: #E23744; z-index: 5; }
  .now-line::before { content: ''; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #E23744; }

  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .month-dow { text-align: center; font-size: 10px; font-weight: 700; text-transform: uppercase; color: rgba(255,255,255,0.7); padding-bottom: 4px; }
  .month-cell {
    background: var(--card); border-radius: 8px; min-height: 78px; padding: 5px;
    cursor: pointer; display: flex; flex-direction: column; gap: 2px;
  }
  .month-cell.other-month { background: rgba(255,255,255,0.06); }
  .month-cell.other-month .m-num { color: rgba(255,255,255,0.4); }
  .month-cell.today { box-shadow: inset 0 0 0 2px var(--gold); }
  .month-cell .m-num { font-size: 11px; font-weight: 700; color: var(--onyx); }
  .m-chip {
    font-size: 9px; color: #FFFFFF; border-radius: 4px; padding: 1px 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .m-more { font-size: 9px; color: var(--taupe); font-weight: 600; }
  @media (max-width: 560px) {
    .month-cell { min-height: 54px; }
    .m-chip { display: none; }
    .month-cell .m-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-right: 2px; }
  }
  .filter-chip {
    background: rgba(255,255,255,0.12); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .filter-chip.active { background: #FFFFFF; color: var(--gold); border-color: #FFFFFF; }

  .type-tag {
    display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 3px 9px; border-radius: 999px; margin-top: 6px; margin-left: 6px;
    border: 1.5px solid var(--gold); color: var(--gold); background: transparent;
  }
  .type-tag.praga { border-color: #1F6F5C; color: #1F6F5C; }

  .empty { text-align: center; color: rgba(255,255,255,0.7); font-size: 14px; padding: 50px 0; }

  .tabs { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.25); }
  .tab-btn {
    background: transparent; border: none; box-shadow: none; border-radius: 0;
    padding: 8px 4px 12px; margin-right: 18px; font-weight: 600; font-size: 13px;
    color: rgba(255,255,255,0.6); cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: #FFFFFF; border-bottom-color: #FFFFFF; }
  .tab-btn:hover { color: #FFFFFF; }

  .card .phone { font-size: 12px; color: var(--taupe); margin-top: 2px; }
  .pay-badge {
    display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 3px 9px; border-radius: 999px; margin-top: 6px;
  }
  .pay-badge.paid { background: #E3F5EA; color: var(--ok); }
  .pay-badge.pending { background: var(--gold-soft); color: var(--gold); }

  .client-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 15px 16px; margin-bottom: 9px;
  }
  .client-card .name { font-weight: 700; font-size: 15px; color: var(--onyx); }
  .client-card .phone { font-size: 12px; color: var(--taupe); margin-top: 2px; }
  .client-card .stats {
    display: flex; gap: 18px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
  }
  .client-card .stat { font-size: 11px; color: var(--taupe); }
  .client-card .stat b { display: block; font-size: 14px; color: var(--onyx); font-weight: 700; }

  .ledger-summary {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px;
  }
  .ledger-summary .box {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; text-align: center;
  }
  .ledger-summary .box .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--taupe); }
  .ledger-summary .box .val { font-size: 15px; font-weight: 700; margin-top: 4px; color: var(--onyx); }
  .ledger-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 14px; margin-bottom: 7px; font-size: 13px;
  }
  .ledger-row .lname { font-weight: 600; color: var(--onyx); }
  .ledger-row .ldate { font-size: 11px; color: var(--taupe); }
  .ledger-row .lamt { text-align: right; font-weight: 700; color: var(--onyx); }
  .ledger-row .lpending { font-size: 11px; color: var(--gold); font-weight: 600; }
  @media (max-width: 560px) {
    .ledger-summary { grid-template-columns: 1fr; }
  }

  /* --- Modal form --- */
  .overlay {
    position: fixed; inset: 0; background: rgba(23,20,15,0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 10;
  }
  .modal {
    background: var(--ivory); border-radius: 20px; padding: 28px;
    width: 100%; max-width: 400px;
    max-height: 88vh; overflow-y: auto;
    border-top: 5px solid var(--gold);
  }
  .modal h3 { font-family: 'Fraunces', serif; font-size: 22px; margin: 0 0 20px; font-weight: 700; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11px; font-weight: 600; color: var(--taupe);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--card);
    font-family: 'Poppins', sans-serif; font-size: 14px; color: var(--onyx);
  }
  .field textarea { resize: vertical; min-height: 50px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button { flex: 1; }
  .msg { font-size: 13px; margin-top: 10px; padding: 8px 10px; border-radius: 4px; }
  .msg.err { background: var(--rose-soft); color: var(--rose); }
  .msg.ok { background: #E1EDE5; color: var(--ok); }

  .fab {
    position: fixed; bottom: 26px; right: 50%;
    transform: translateX(200px);
    box-shadow: 0 6px 18px rgba(23,20,15,0.28);
  }
  @media (max-width: 560px) {
    .fab { right: 20px; transform: none; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="hero">
  <a class="ig" href="https://www.instagram.com/danieldmakeup/" target="_blank" rel="noopener">@danieldmakeup ↗</a>
  <h1 class="wordmark">Daniel D. <em>Makeup</em></h1>
  <div class="rule"></div>
  <p class="tagline">Agenda de citas</p>
  <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">Sin conectar</span></div>
</header>
<div class="app">
  <div class="content">

  <div id="connectScreen" class="connect-card">
    <div class="mirror"></div>
    <p>Conecta la cuenta de Google Calendar del maquillador para ver y crear citas. Una vez conectado, todo lo que agendes aquí aparece automáticamente en su iPhone.</p>
    <button class="btn-primary" id="connectBtn">Conectar con Google</button>
    <div id="connectMsg"></div>
  </div>

  <div id="mainScreen" style="display:none;">
    <div class="toolbar">
      <h2 id="sectionTitle">Próximas citas</h2>
      <button class="btn-primary" id="newBtnTop">+ Nueva cita</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="citas">Citas</button>
      <button class="tab-btn" data-tab="clientas">Clientas</button>
      <button class="tab-btn" data-tab="contable">Contable</button>
      <button class="btn-ghost" id="fixColorsBtn" style="padding:6px 14px; font-size:11px; color:#FFFFFF; border-color:rgba(255,255,255,0.4);">🎨 Actualizar colores</button>
      <button class="btn-ghost" id="recoverBtn" style="padding:6px 14px; font-size:11px; color:#FFFFFF; border-color:rgba(255,255,255,0.4);">↩️ Recuperar citas de Praga</button>
      <button class="btn-ghost" id="exportBtn" style="margin-left:auto; padding:6px 14px; font-size:11px; color:#FFFFFF; border-color:rgba(255,255,255,0.4);">⬇ Exportar Excel</button>
    </div>
    <div id="tabCitas" class="tab-panel">
      <div class="filter-row">
        <button class="filter-chip active" data-filter="todas" onclick="setCitasFilter('todas')">Todas</button>
        <button class="filter-chip" data-filter="domicilio" onclick="setCitasFilter('domicilio')">A domicilio</button>
        <button class="filter-chip" data-filter="praga" onclick="setCitasFilter('praga')">Agenda Praga</button>
      </div>
      <div class="filter-row">
        <button class="filter-chip view-btn active" data-view="month" onclick="setCitasView('month')">🗓️ Mes</button>
        <button class="filter-chip view-btn" data-view="timeline" onclick="setCitasView('timeline')">📅 Día</button>
        <button class="filter-chip view-btn" data-view="week" onclick="setCitasView('week')">📆 Semana</button>
        <button class="filter-chip view-btn" data-view="list" onclick="setCitasView('list')">☰ Lista</button>
      </div>
      <div id="monthView">
        <div class="day-nav">
          <button class="icon-btn nav" onclick="changeMonth(-1)">‹</button>
          <span class="day-label" id="monthLabel"></span>
          <button class="icon-btn nav" onclick="changeMonth(1)">›</button>
          <button class="filter-chip" onclick="goThisMonth()" style="margin-left:10px;">Hoy</button>
        </div>
        <div class="month-grid" id="monthGrid"></div>
      </div>
      <div id="timelineView" style="display:none;">
        <div class="day-nav">
          <button class="icon-btn nav" onclick="changeDay(-1)">‹</button>
          <span class="day-label" id="dayLabel"></span>
          <button class="icon-btn nav" onclick="changeDay(1)">›</button>
          <button class="filter-chip" onclick="goToday()" style="margin-left:10px;">Hoy</button>
        </div>
        <div id="timelineGrid" class="timeline-grid"></div>
      </div>
      <div id="weekView" style="display:none;">
        <div class="day-nav">
          <button class="icon-btn nav" onclick="changeWeek(-1)">‹</button>
          <span class="day-label" id="weekLabel"></span>
          <button class="icon-btn nav" onclick="changeWeek(1)">›</button>
          <button class="filter-chip" onclick="goThisWeek()" style="margin-left:10px;">Hoy</button>
        </div>
        <div class="week-outer">
          <div class="week-gutter" id="weekGutter"></div>
          <div class="week-scroll">
            <div class="week-grid" id="weekGrid"></div>
          </div>
        </div>
      </div>
      <div id="listView" style="display:none;">
        <div id="agendaList"></div>
      </div>
    </div>
    <div id="tabClientas" class="tab-panel" style="display:none;">
      <div id="clientList"></div>
    </div>
    <div id="tabContable" class="tab-panel" style="display:none;">
      <div id="ledgerSummary"></div>
      <div id="ledgerList"></div>
    </div>
  </div>
  </div>
</div>

<button class="btn-primary fab" id="fab" style="display:none;">+ Nueva cita</button>

<div id="overlay" class="overlay" style="display:none;">
  <div class="modal">
    <h3 id="modalTitle">Nueva cita</h3>
    <div class="field">
      <label>Cliente</label>
      <input type="text" id="fClient" placeholder="Nombre del cliente">
    </div>
    <div class="field">
      <label>Teléfono</label>
      <input type="tel" id="fPhone" placeholder="300 000 0000">
    </div>
    <div class="field">
      <label>Cédula</label>
      <input type="text" id="fCedula" placeholder="Número de cédula">
    </div>
    <div class="field">
      <label>Dirección del servicio</label>
      <input type="text" id="fAddress" placeholder="Barrio, dirección...">
    </div>
    <div class="field">

<script>
const CLIENT_ID = '351176982384-489oulpick1pkgdp229fm984itrbthrm.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly';
const TZ = 'America/Bogota';
const APP_TAG = 'daniel-makeup-agenda';
const SERVICE_COLORS = {
  'Maquillaje social': '#5A1620',
  'Maquillaje de novia': '#8C3B4A',
  'Maquillaje y peinado': '#7A2A34',
  'Prueba de novia': '#C9938E',
  'Ondas': '#14090A',
  'Blower': '#6E6259',
  'Recogido': '#3A0F14',
  'Otro': '#A79C8C'
};

let accessToken = null;
let tokenClient = null;
let editingEventId = null;
let currentTab = 'citas';

function money(n) {
  return '$' + Math.round(n || 0).toLocaleString('es-CO');
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => switchTab(btn.dataset.tab);
});

function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.getElementById('tabCitas').style.display = name === 'citas' ? 'block' : 'none';
  document.getElementById('tabClientas').style.display = name === 'clientas' ? 'block' : 'none';
  document.getElementById('tabContable').style.display = name === 'contable' ? 'block' : 'none';
  const titles = { citas: 'Próximas citas', clientas: 'Clientas', contable: 'Contable' };
  document.getElementById('sectionTitle').textContent = titles[name];
  if (name === 'clientas') loadClientas();
  if (name === 'contable') loadContable();
}

function setStatus(connected) {
  document.getElementById('statusDot').classList.toggle('on', connected);
  document.getElementById('statusText').textContent = connected ? 'Conectado' : 'Sin conectar';
}

function initGoogle() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error) {
        document.getElementById('connectMsg').innerHTML = '<div class="msg err">No se pudo conectar: ' + resp.error + '</div>';
        return;
      }
      accessToken = resp.access_token;
      onConnected();
    }
  });
}

document.getElementById('connectBtn').onclick = () => tokenClient.requestAccessToken();

function onConnected() {
  setStatus(true);
  document.getElementById('connectScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  document.getElementById('fab').style.display = 'block';
  loadEvents();
}

async function apiFetch(url, options = {}) {
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + accessToken });
  let res = await fetch(url, options);
  if (res.status === 401) {
    accessToken = await new Promise((resolve) => {
      tokenClient.callback = (resp) => resolve(resp.access_token);
      tokenClient.requestAccessToken();
    });
    options.headers['Authorization'] = 'Bearer ' + accessToken;
    res = await fetch(url, options);
  }
  return res;
}

let citasCache = [];
let citasFilter = 'todas';
let citasView = 'month';
let timelineDay = new Date();
timelineDay.setHours(0, 0, 0, 0);

async function loadEvents() {
  document.getElementById('agendaList').innerHTML = '<div class="empty">Cargando citas...</div>';
  document.getElementById('timelineGrid').innerHTML = '<div class="tl-empty">Cargando citas...</div>';
  const now = new Date();
  const past = new Date(now.getTime() - 60 * 24 * 3600 * 1000);
  const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events'
    + '?timeMin=' + past.toISOString()
    + '&privateExtendedProperty=' + encodeURIComponent('app=' + APP_TAG)
    + '&singleEvents=true&orderBy=startTime&maxResults=2500';
  try {
    const res = await apiFetch(url);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Error al cargar');
    citasCache = data.items || [];
    renderCitasView();
  } catch (e) {
    const msg = '<div class="empty">No se pudieron cargar las citas.<br>' + e.message + '</div>';
    document.getElementById('agendaList').innerHTML = msg;
    document.getElementById('timelineGrid').innerHTML = '<div class="tl-empty">No se pudieron cargar las citas.</div>';
  }
}

function renderCitasView() {
  if (citasView === 'month') renderMonth();
  else if (citasView === 'timeline') renderTimeline();
  else if (citasView === 'week') renderWeek();
  else renderEvents(applyFilter(citasCache));
}

let monthAnchor = new Date();
monthAnchor.setDate(1);
monthAnchor.setHours(0, 0, 0, 0);

function changeMonth(delta) {
  monthAnchor.setMonth(monthAnchor.getMonth() + delta);
  renderMonth();
}

function goThisMonth() {
  monthAnchor = new Date();
  monthAnchor.setDate(1);
  monthAnchor.setHours(0, 0, 0, 0);
  renderMonth();
}

function renderMonth() {
  document.getElementById('monthLabel').textContent = monthAnchor.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
  const firstOfMonth = new Date(monthAnchor);
  const gridStart = mondayOf(firstOfMonth);
  const todayStr = new Date().toDateString();
  const allEvents = applyFilter(citasCache);

  let html = '';
  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d => html += '<div class="month-dow">' + d + '</div>');

  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    const inMonth = d.getMonth() === monthAnchor.getMonth();
    const isToday = d.toDateString() === todayStr;
    const dayEvents = allEvents
      .filter(ev => ev.start && ev.start.dateTime && new Date(ev.start.dateTime).toDateString() === d.toDateString())
      .sort((a, b) => new Date(a.start.dateTime) - new Date(b.start.dateTime));

    html += '<div class="month-cell' + (inMonth ? '' : ' other-month') + (isToday ? ' today' : '') + '" onclick="jumpToDay(\'' + d.toISOString() + '\')">';
    html += '<div class="m-num">' + d.getDate() + '</div>';
    dayEvents.slice(0, 3).forEach(ev => {
      const parts = (ev.summary || 'Cita').split(' — ');
      const service = parts.length > 1 ? parts[0] : 'Otro';
      const client = parts.length > 1 ? parts[1] : (ev.summary || 'Cliente');
      const color = SERVICE_COLORS[service] || SERVICE_COLORS['Otro'];
      html += '<span class="m-dot" style="background:' + color + '"></span><span class="m-chip" style="background:' + color + '">' + client + '</span>';
    });
    if (dayEvents.length > 3) html += '<div class="m-more">+' + (dayEvents.length - 3) + ' más</div>';
    html += '</div>';
  }
  document.getElementById('monthGrid').innerHTML = html;
}

function jumpToDay(iso) {
  timelineDay = new Date(iso);
  timelineDay.setHours(0, 0, 0, 0);
  setCitasView('timeline');
}

const TL_START_H = 7, TL_END_H = 21, TL_HOUR_PX = 56;
let weekAnchor = new Date();
weekAnchor.setHours(0, 0, 0, 0);

function setCitasView(v) {
  citasView = v;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  document.getElementById('monthView').style.display = v === 'month' ? 'block' : 'none';
  document.getElementById('timelineView').style.display = v === 'timeline' ? 'block' : 'none';
  document.getElementById('weekView').style.display = v === 'week' ? 'block' : 'none';
  document.getElementById('listView').style.display = v === 'list' ? 'block' : 'none';
  renderCitasView();
}

function changeWeek(delta) {
  weekAnchor.setDate(weekAnchor.getDate() + delta * 7);
  renderWeek();
}

function goThisWeek() {
  weekAnchor = new Date();
  weekAnchor.setHours(0, 0, 0, 0);
  renderWeek();
}

function mondayOf(d) {
  const day = d.getDay(); // 0=Dom
  const diff = day === 0 ? -6 : 1 - day;
  const m = new Date(d);
  m.setDate(d.getDate() + diff);
  return m;
}

function hourLinesHtml(totalHeight) {
  let html = '';
  for (let h = TL_START_H; h <= TL_END_H; h++) {
    const top = (h - TL_START_H) * TL_HOUR_PX;
    html += '<div class="tl-hourline" style="top:' + top + 'px;"></div>';
    if (h < TL_END_H) html += '<div class="tl-hourline half" style="top:' + (top + TL_HOUR_PX / 2) + 'px;"></div>';
  }
  return html;
}

function renderWeek() {
  const monday = mondayOf(weekAnchor);
  const days = [];
  for (let i = 0; i < 7; i++) { const d = new Date(monday); d.setDate(monday.getDate() + i); days.push(d); }
  const label = days[0].toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }) + ' – ' + days[6].toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' });
  document.getElementById('weekLabel').textContent = label;

  const totalHeight = (TL_END_H - TL_START_H) * TL_HOUR_PX;
  const gutter = document.getElementById('weekGutter');
  let gutterHtml = '<div class="week-col-header">&nbsp;</div><div style="position:relative; height:' + totalHeight + 'px;">';
  for (let h = TL_START_H; h <= TL_END_H; h++) {
    const top = (h - TL_START_H) * TL_HOUR_PX;
    gutterHtml += '<div class="tl-hourlabel" style="top:' + top + 'px; left:4px;">' + (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? 'a' : 'p') + '</div>';
  }
  gutterHtml += '</div>';
  gutter.innerHTML = gutterHtml;

  const now = new Date();
  const nowMin = (now.getHours() - TL_START_H) * 60 + now.getMinutes();
  const showNowLine = now >= new Date(now).setHours(TL_START_H,0,0,0) && now <= new Date(now).setHours(TL_END_H,0,0,0);

  const todayStr = new Date().toDateString();
  const allEvents = applyFilter(citasCache);
  let gridHtml = '';
  days.forEach(d => {
    const isToday = d.toDateString() === todayStr;
    gridHtml += '<div class="week-col">';
    gridHtml += '<div class="week-col-header' + (isToday ? ' today' : '') + '">' + d.toLocaleDateString('es-CO', { weekday: 'short' }) + '<span class="wn">' + d.getDate() + '</span></div>';
    gridHtml += '<div class="week-body" style="height:' + totalHeight + 'px;">' + hourLinesHtml(totalHeight);
    if (isToday && showNowLine) {
      gridHtml += '<div class="now-line" style="top:' + ((nowMin / 60) * TL_HOUR_PX) + 'px;"></div>';
    }
    const dayEvents = allEvents.filter(ev => ev.start && ev.start.dateTime && new Date(ev.start.dateTime).toDateString() === d.toDateString());
    dayEvents.forEach(ev => {
      const start = new Date(ev.start.dateTime);
      const end = new Date(ev.end.dateTime);
      const startMin = Math.max(0, (start.getHours() - TL_START_H) * 60 + start.getMinutes());
      const durMin = Math.max(20, (end - start) / 60000);
      const top = (startMin / 60) * TL_HOUR_PX;
      const height = (durMin / 60) * TL_HOUR_PX - 2;
      const parts = (ev.summary || 'Cita').split(' — ');
      const service = parts.length > 1 ? parts[0] : 'Otro';
      const client = parts.length > 1 ? parts[1] : (ev.summary || 'Cliente');
      const color = SERVICE_COLORS[service] || SERVICE_COLORS['Otro'];
      const timeStr = start.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' })
        + ' - ' + end.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' });
      gridHtml += '<div class="wk-block" style="top:' + top + 'px; height:' + height + 'px; background:' + color + ';" data-id="' + ev.id + '">'
        + '<b>' + client + '</b>' + timeStr + (height > 50 ? '<div style="opacity:.85; margin-top:2px;">' + service + '</div>' : '') + '</div>';
    });
    gridHtml += '</div></div>';
  });
  document.getElementById('weekGrid').innerHTML = gridHtml;
  document.getElementById('weekGrid').querySelectorAll('.wk-block').forEach(el => {
    el.onclick = () => {
      const ev = citasCache.find(e => e.id === el.dataset.id);
      if (ev) openModal(ev);
    };
  });
}

function changeDay(delta) {
  timelineDay.setDate(timelineDay.getDate() + delta);
  renderTimeline();
}

function goToday() {
  timelineDay = new Date();
  timelineDay.setHours(0, 0, 0, 0);
  renderTimeline();
}

function renderTimeline() {
  document.getElementById('dayLabel').textContent = timelineDay.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
  const grid = document.getElementById('timelineGrid');
  const dayEvents = applyFilter(citasCache).filter(ev => {
    if (!ev.start || !ev.start.dateTime) return false;
    const d = new Date(ev.start.dateTime);
    return d.toDateString() === timelineDay.toDateString();
  });

  const START_H = 7, END_H = 21, HOUR_PX = 56;
  const totalHeight = (END_H - START_H) * HOUR_PX;
  let html = '<div style="position:relative; height:' + totalHeight + 'px; margin-left:0;">';
  for (let h = START_H; h <= END_H; h++) {
    const top = (h - START_H) * HOUR_PX;
    html += '<div class="tl-hourline" style="top:' + top + 'px;"></div>';
    html += '<div class="tl-hourlabel" style="top:' + top + 'px;">' + (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? ' a.m.' : ' p.m.') + '</div>';
    if (h < END_H) {
      html += '<div class="tl-hourline half" style="top:' + (top + HOUR_PX / 2) + 'px;"></div>';
    }
  }
  dayEvents.forEach(ev => {
    const start = new Date(ev.start.dateTime);
    const end = new Date(ev.end.dateTime);
    const startMin = Math.max(0, (start.getHours() - START_H) * 60 + start.getMinutes());
    const durMin = Math.max(20, (end - start) / 60000);
    const top = (startMin / 60) * HOUR_PX;
    const height = (durMin / 60) * HOUR_PX - 2;
    const parts = (ev.summary || 'Cita').split(' — ');
    const service = parts.length > 1 ? parts[0] : 'Otro';
    const client = parts.length > 1 ? parts[1] : (ev.summary || 'Cliente');
    const color = SERVICE_COLORS[service] || SERVICE_COLORS['Otro'];
    const timeStr = start.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' });
    html += '<div class="tl-block" style="top:' + top + 'px; height:' + height + 'px; background:' + color + ';" data-id="' + ev.id + '">'
      + '<div class="tb-time">' + timeStr + '</div>'
      + '<div class="tb-name">' + client + '</div>'
      + (height > 40 ? '<div class="tb-svc">' + service + '</div>' : '')
      + '</div>';
  });
  html += '</div>';
  grid.innerHTML = html;
  if (!dayEvents.length) {
    grid.insertAdjacentHTML('beforeend', '<div class="tl-empty" style="position:absolute; top:50%; left:0; right:0; transform:translateY(-50%);">Sin citas este día</div>');
  }
  grid.querySelectorAll('.tl-block').forEach(el => {
    el.onclick = () => {
      const ev = citasCache.find(e => e.id === el.dataset.id);
      if (ev) openModal(ev);
    };
  });
}

function effectiveTipo(ev) {
  const props = (ev.extendedProperties && ev.extendedProperties.private) || {};
  if (props.tipo) return props.tipo;
  if (props.address && /praga/i.test(props.address)) return 'praga';
  return 'domicilio';
}

function applyFilter(items) {
  if (citasFilter === 'todas') return items;
  return items.filter(ev => effectiveTipo(ev) === citasFilter);
}

function setCitasFilter(f) {
  citasFilter = f;
  document.querySelectorAll('.filter-chip[data-filter]').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  renderCitasView();
}

function dayLabel(date) {
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  const d = new Date(date); d.setHours(0,0,0,0);
  if (d.getTime() === today.getTime()) return 'Hoy';
  if (d.getTime() === tomorrow.getTime()) return 'Mañana';
  return d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
}

function renderEvents(items) {
  const list = document.getElementById('agendaList');
  if (!items.length) {
    list.innerHTML = '<div class="empty">No hay citas programadas.</div>';
    return;
  }
  const groups = {};
  items.forEach(ev => {
    if (!ev.start || !ev.start.dateTime) return; // skip all-day events
    const d = new Date(ev.start.dateTime);
    const key = d.toDateString();
    if (!groups[key]) groups[key] = { date: d, events: [] };
    groups[key].events.push(ev);
  });
  list.innerHTML = '';
  Object.values(groups).forEach(group => {
    const section = document.createElement('div');
    section.className = 'day-group';
    section.innerHTML = '<div class="day-label">' + dayLabel(group.date) + '</div>';
    group.events.forEach(ev => section.appendChild(renderCard(ev)));
    list.appendChild(section);
  });
}

const ICONS = {
  calendar: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  clock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>',
  pin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.6"/></svg>',
  phone: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15.5v2.7a1.8 1.8 0 0 1-2 1.8 17.6 17.6 0 0 1-7.6-2.7 17.3 17.3 0 0 1-5.4-5.4A17.6 17.6 0 0 1 3.3 4.3 1.8 1.8 0 0 1 5.1 2.3H7.8a1.8 1.8 0 0 1 1.8 1.5c.11.85.32 1.68.62 2.47a1.8 1.8 0 0 1-.4 1.9l-1.1 1.1a14.1 14.1 0 0 0 5.4 5.4l1.1-1.1a1.8 1.8 0 0 1 1.9-.4c.79.3 1.62.51 2.47.62a1.8 1.8 0 0 1 1.5 1.83z"/></svg>'
};

function renderCard(ev) {
  const start = new Date(ev.start.dateTime);
  const end = new Date(ev.end.dateTime);
  const dateStr = start.toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' });
  const timeStr = start.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' })
    + ' – ' + end.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' });
  const parts = (ev.summary || 'Cita').split(' — ');
  const service = parts.length > 1 ? parts[0] : 'Otro';
  const client = parts.length > 1 ? parts[1] : (ev.summary || 'Cliente');
  const color = SERVICE_COLORS[service] || SERVICE_COLORS['Otro'];
  const props = (ev.extendedProperties && ev.extendedProperties.private) || {};
  const price = parseInt(props.price, 10) || 0;
  const advance = parseInt(props.advance, 10) || 0;

  let payBadge = '';
  if (price > 0) {
    payBadge = advance >= price
      ? '<span class="pay-badge paid">Pagado</span>'
      : advance > 0
        ? '<span class="pay-badge pending">Anticipo ' + money(advance) + '</span>'
        : '<span class="pay-badge pending">Sin anticipo</span>';
  }

  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--accent', color);
  card.innerHTML = `
    <div class="card-top">
      <div>
        <p class="who">${client}</p>
        <span class="svc-tag">${service}</span>
        <span class="type-tag ${effectiveTipo(ev) === 'praga' ? 'praga' : ''}">${effectiveTipo(ev) === 'praga' ? 'Agenda Praga' : 'A domicilio'}</span>
        ${payBadge}
      </div>
      <div class="actions">

      </div>

      ${props.phone ? '<div class="meta-row muted">' + ICONS.phone + '<span>' + props.phone + '</span></div>' : ''}

  `;

}

function duplicateAppt(ev) {
  openModal(null);

  const props = (ev.extendedProperties && ev.extendedProperties.private) || {};
  document.getElementById('fService').value = parts.length > 1 ? parts[0] : 'Otro';
  document.getElementById('fClient').value = parts.length > 1 ? parts[1] : (ev.summary || '');
  document.getElementById('fPhone').value = props.phone || '';
  document.getElementById('fCedula').value = props.cedula || '';
  document.getElementById('fAddress').value = props.address || '';
  document.getElementById('fTipo').value = props.tipo || 'domicilio';
  document.getElementById('fPrice').value = props.price && props.price !== '0' ? props.price : '';

function openModal(ev) {
  editingEventId = ev ? ev.id : null;
  document.getElementById('modalTitle').textContent = ev ? 'Editar cita' : 'Nueva cita';
  document.getElementById('formMsg').innerHTML = '';
  clearExtraDates();
  document.getElementById('addDateBtn').style.display = ev ? 'none' : 'block';
  if (ev) {
    const parts = (ev.summary || '').split(' — ');
    document.getElementById('fService').value = parts.length > 1 ? parts[0] : 'Otro';
    document.getElementById('fClient').value = parts.length > 1 ? parts[1] : (ev.summary || '');
    const props = (ev.extendedProperties && ev.extendedProperties.private) || {};
    document.getElementById('fPhone').value = props.phone || '';
    document.getElementById('fCedula').value = props.cedula || '';
    document.getElementById('fTipo').value = props.tipo || 'domicilio';
    document.getElementById('fAddress').value = props.address || '';
    document.getElementById('fPrice').value = props.price && props.price !== '0' ? props.price : '';
    document.getElementById('fAdvance').value = props.advance && props.advance !== '0' ? props.advance : '';
    document.getElementById('fNotes').value = ev.description || '';
    const start = new Date(ev.start.dateTime);
    const end = new Date(ev.end.dateTime);
    document.getElementById('fDate').value = start.toISOString().slice(0,10);
    document.getElementById('fTime').value = start.toTimeString().slice(0,5);
    document.getElementById('fDuration').value = Math.round((end - start) / 60000);
    const overrides = (ev.reminders && ev.reminders.overrides) || [];
    const shortAlert = overrides.filter(o => o.minutes < 1440).sort((a,b) => a.minutes - b.minutes)[0];
    const confirmAlert = overrides.filter(o => o.minutes >= 1440).sort((a,b) => a.minutes - b.minutes)[0];
    document.getElementById('fReminder').value = shortAlert ? shortAlert.minutes : '0';
    document.getElementById('fConfirm').value = confirmAlert ? confirmAlert.minutes : '0';
  } else {
    document.getElementById('fClient').value = '';
    document.getElementById('fPhone').value = '';
    document.getElementById('fCedula').value = '';
    document.getElementById('fTipo').value = 'domicilio';
    document.getElementById('fAddress').value = '';
    document.getElementById('fPrice').value = '';
    document.getElementById('fAdvance').value = '';
    document.getElementById('fService').value = 'Maquillaje social';
    document.getElementById('fNotes').value = '';
    document.getElementById('fDuration').value = '60';
    document.getElementById('fReminder').value = '30';
    document.getElementById('fConfirm').value = '1440';
    const now = new Date();
    document.getElementById('fDate').value = now.toISOString().slice(0,10);
    document.getElementById('fTime').value = '09:00';
  }
  document.getElementById('overlay').style.display = 'flex';
}

function closeModal() {

document.getElementById('saveBtn').onclick = async () => {
  const client = document.getElementById('fClient').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const cedula = document.getElementById('fCedula').value.trim();
  const tipo = document.getElementById('fTipo').value;
  const address = document.getElementById('fAddress').value.trim();
  const service = document.getElementById('fService').value;
  const date = document.getElementById('fDate').value;
  const time = document.getElementById('fTime').value;
  const duration = parseInt(document.getElementById('fDuration').value, 10);
  const notes = document.getElementById('fNotes').value.trim();
  const reminderMin = parseInt(document.getElementById('fReminder').value, 10);
  const confirmMin = parseInt(document.getElementById('fConfirm').value, 10);
  const price = parseInt(document.getElementById('fPrice').value, 10) || 0;
  const advance = parseInt(document.getElementById('fAdvance').value, 10) || 0;
  const msg = document.getElementById('formMsg');

  if (!client || !date || !time) {
    msg.innerHTML = '<div class="msg err">Completa cliente, fecha y hora.</div>';
    return;
  }

  // Recoger todas las fechas: la principal + las que se hayan agregado
  const dateTimes = [{ date, time }];
  document.querySelectorAll('#extraDates .row2').forEach(row => {
    const dInput = row.querySelector('input[type="date"]');
    const tInput = row.querySelector('input[type="time"]');
    if (dInput.value && tInput.value) dateTimes.push({ date: dInput.value, time: tInput.value });
  });

  // Validar que ninguna de las fechas choque con una cita ya agendada, ni entre ellas mismas
  for (let i = 0; i < dateTimes.length; i++) {
    const dt = dateTimes[i];
    const newStart = new Date(dt.date + 'T' + dt.time + ':00');
    const newEnd = new Date(newStart.getTime() + duration * 60000);
    const overlapsOwn = dateTimes.some((other, j) => {
      if (j === i) return false;
      const oStart = new Date(other.date + 'T' + other.time + ':00');
      const oEnd = new Date(oStart.getTime() + duration * 60000);
      return newStart < oEnd && oStart < newEnd;
    });
    if (overlapsOwn) {
      msg.innerHTML = '<div class="msg err">Dos de las fechas que agregaste se cruzan entre sí. Revísalas.</div>';
      return;
    }
    const conflict = citasCache.find(ev => {
      if (editingEventId && ev.id === editingEventId) return false;
      if (!ev.start || !ev.start.dateTime) return false;
      const evStart = new Date(ev.start.dateTime);
      const evEnd = new Date(ev.end.dateTime);
      return newStart < evEnd && evStart < newEnd;
    });
    if (conflict) {
      const parts = (conflict.summary || 'Cita').split(' — ');
      const conflictClient = parts.length > 1 ? parts[1] : conflict.summary;
      const conflictTime = new Date(conflict.start.dateTime).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
      msg.innerHTML = '<div class="msg err">Ya hay una cita con <b>' + conflictClient + '</b> el ' + conflictTime + ' que se cruza con este horario. Cambia la hora o la duración.</div>';
      return;
    }
  }

  const descLines = [];
  if (phone) descLines.push('Tel: ' + phone);
  if (address) descLines.push('Dirección: ' + address);
  if (price) descLines.push('Precio: ' + money(price) + (advance > 0 ? ' · Anticipo: ' + money(advance) : ' · Sin anticipo'));
  if (notes) descLines.push('', notes);

  const overrides = [];
  if (reminderMin > 0) overrides.push({ method: 'popup', minutes: reminderMin });
  if (confirmMin > 0) overrides.push({ method: 'popup', minutes: confirmMin });
  if (tipo === 'praga' && confirmMin !== 43200) overrides.push({ method: 'popup', minutes: 43200 }); // 1 mes antes, para pasarla a la agenda de Praga

  const colorId = tipo === 'praga' ? '10' : '11'; // 10 = verde (Basil), 11 = rojo (Tomato)

  try {
    for (const dt of dateTimes) {
      const start = new Date(dt.date + 'T' + dt.time + ':00');
      const end = new Date(start.getTime() + duration * 60000);
      const body = {
        summary: service + ' — ' + client,
        description: descLines.join('\n'),
        start: { dateTime: start.toISOString(), timeZone: TZ },
        end: { dateTime: end.toISOString(), timeZone: TZ },
        reminders: { useDefault: false, overrides },
        colorId,
        extendedProperties: {
          private: { app: APP_TAG, phone, cedula, address, tipo, price: String(price), advance: String(advance) }
        }
      };
      const url = editingEventId
        ? 'https://www.googleapis.com/calendar/v3/calendars/primary/events/' + editingEventId
        : 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
      const method = editingEventId ? 'PATCH' : 'POST';
      const res = await apiFetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || 'Error al guardar');
    }
    closeModal();
    refreshCurrentViews();
  } catch (e) {
    msg.innerHTML = '<div class="msg err">' + e.message + '</div>';
  }
};

async function deleteEvent(id) {
  if (!confirm('¿Eliminar esta cita?')) return;
  try {
    const res = await apiFetch('https://www.googleapis.com/calendar/v3/calendars/primary/events/' + id, { method: 'DELETE' });
    if (!res.ok && res.status !== 410) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error?.message || 'Error al eliminar');
    }
    loadEvents();
    if (currentTab === 'clientas') loadClientas();
    if (currentTab === 'contable') loadContable();
  } catch (e) {
    alert('No se pudo eliminar: ' + e.message);
  }
}

async function fetchEventsRange(daysPast, daysFuture) {
  const now = new Date();
  const min = new Date(now.getTime() - daysPast * 24 * 3600 * 1000);
  const max = new Date(now.getTime() + daysFuture * 24 * 3600 * 1000);
  const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events'
    + '?timeMin=' + min.toISOString()
    + '&timeMax=' + max.toISOString()
    + '&privateExtendedProperty=' + encodeURIComponent('app=' + APP_TAG)
    + '&singleEvents=true&orderBy=startTime&maxResults=250';
  const res = await apiFetch(url);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'Error al cargar');
  return (data.items || []).filter(ev => ev.start && ev.start.dateTime);
}

async function loadClientas() {
  const el = document.getElementById('clientList');
  el.innerHTML = '<div class="empty">Cargando clientas...</div>';
  try {
    const items = await fetchEventsRange(365, 60);
    const byKey = {};
    items.forEach(ev => {
      const parts = (ev.summary || 'Cita').split(' — ');
      const client = parts.length > 1 ? parts[1] : (ev.summary || 'Cliente');
      const props = (ev.extendedProperties && ev.extendedProperties.private) || {};
      const key = (props.phone || client).trim().toLowerCase();
      const price = parseInt(props.price, 10) || 0;
      const advance = parseInt(props.advance, 10) || 0;
      if (!byKey[key]) byKey[key] = { name: client, phone: props.phone || '', cedula: props.cedula || '', count: 0, total: 0, advance: 0, last: new Date(ev.start.dateTime), events: [] };
      const c = byKey[key];
      if (!c.cedula && props.cedula) c.cedula = props.cedula;
      c.count += 1;
      c.total += price;
      c.advance += advance;
      c.events.push(ev);
      const d = new Date(ev.start.dateTime);
      if (d > c.last) c.last = d;
    });
    const clients = Object.values(byKey).sort((a, b) => b.last - a.last);
    if (!clients.length) {
      el.innerHTML = '<div class="empty">Aún no hay clientas registradas.</div>';
      return;
    }
    el.innerHTML = '';
    clients.forEach((c, idx) => {
      const pending = c.total - c.advance;
      const div = document.createElement('div');
      div.className = 'client-card';
      const detailId = 'clientDetail' + idx;
      div.innerHTML = `
        <div class="name">${c.name}</div>
        ${c.phone ? '<div class="phone">' + c.phone + (c.cedula ? ' · C.C. ' + c.cedula : '') + '</div>' : ''}
        <div class="stats">
          <div class="stat">Citas<b>${c.count}</b></div>
          <div class="stat">Facturado<b>${money(c.total)}</b></div>
          <div class="stat">Pendiente<b style="${pending > 0 ? 'color:var(--gold)' : ''}">${money(pending)}</b></div>
        </div>
        <button class="icon-btn" style="margin-top:8px; padding:4px 0; color:var(--gold); font-weight:600;" data-toggle="${detailId}">Ver / editar sus citas ▾</button>
        <div id="${detailId}" class="client-detail" style="display:none; margin-top:8px;"></div>
      `;
      el.appendChild(div);
      div.querySelector('[data-toggle]').onclick = (e) => {
        const box = document.getElementById(detailId);
        const showing = box.style.display !== 'none';
        box.style.display = showing ? 'none' : 'block';
        e.target.textContent = showing ? 'Ver / editar sus citas ▾' : 'Ocultar citas ▲';
        if (!showing) {
          box.innerHTML = '';
          c.events.sort((a, b) => new Date(b.start.dateTime) - new Date(a.start.dateTime)).forEach(ev => box.appendChild(renderMiniAppt(ev)));
        }
      };
    });
  } catch (e) {
    el.innerHTML = '<div class="empty">No se pudo cargar.<br>' + e.message + '</div>';
  }
}

async function loadContable() {
  const summaryEl = document.getElementById('ledgerSummary');
  const listEl = document.getElementById('ledgerList');
  listEl.innerHTML = '<div class="empty">Cargando...</div>';
  summaryEl.innerHTML = '';
  try {
    const items = await fetchEventsRange(365, 60);
    let totalFacturado = 0, totalCobrado = 0;
    const rows = items.map(ev => {
      const parts = (ev.summary || 'Cita').split(' — ');
      const client = parts.length > 1 ? parts[1] : (ev.summary || 'Cliente');
      const props = (ev.extendedProperties && ev.extendedProperties.private) || {};
      const price = parseInt(props.price, 10) || 0;
      const advance = parseInt(props.advance, 10) || 0;
      totalFacturado += price;
      totalCobrado += advance;
      return { ev, client, date: new Date(ev.start.dateTime), price, advance, pending: price - advance };

async function recoverFromPraga() {
  const btn = document.getElementById('recoverBtn');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Buscando...';
  try {
    const listRes = await apiFetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=250');
    const listData = await listRes.json();
    if (!listRes.ok) throw new Error(listData.error?.message || 'No se pudo leer la lista de calendarios');
    const found = (listData.items || []).find(c => c.summary === 'Agenda Praga — Daniel D. Makeup');
    if (!found) {
      alert('No se encontró el calendario "Agenda Praga — Daniel D. Makeup". Puede que ya no exista o tenga otro nombre.');
      return;
    }
    const now = new Date();
    const past = new Date(now.getTime() - 365 * 24 * 3600 * 1000);
    const future = new Date(now.getTime() + 365 * 24 * 3600 * 1000);
    const evUrl = 'https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(found.id) + '/events'
      + '?timeMin=' + past.toISOString() + '&timeMax=' + future.toISOString()
      + '&singleEvents=true&maxResults=250';
    const evRes = await apiFetch(evUrl);
    const evData = await evRes.json();
    if (!evRes.ok) throw new Error(evData.error?.message || 'No se pudieron leer las citas de ese calendario');
    const items = evData.items || [];
    if (!items.length) {
      alert('Ese calendario no tiene citas para recuperar.');
      return;
    }
    let moved = 0;
    for (const ev of items) {
      btn.textContent = 'Moviendo ' + (moved + 1) + '/' + items.length + '...';
      const moveUrl = 'https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(found.id)
        + '/events/' + ev.id + '/move?destination=primary';
      const moveRes = await apiFetch(moveUrl, { method: 'POST' });
      if (moveRes.ok) moved++;
    }
    alert('Listo: se recuperaron ' + moved + ' cita(s) al calendario principal.');
    refreshCurrentViews();
  } catch (e) {
    alert('No se pudo recuperar: ' + e.message);
  } finally {
    btn.textContent = original;
    btn.disabled = false;
  }
}

async function fixExistingColors() {
  const btn = document.getElementById('fixColorsBtn');
  const original = btn.textContent;
  btn.disabled = true;
  try {
    const items = await fetchEventsRange(365, 365);
    let updated = 0;
    for (const ev of items) {
      const wantColor = effectiveTipo(ev) === 'praga' ? '10' : '11';
      if (ev.colorId !== wantColor) {
        btn.textContent = 'Actualizando ' + (updated + 1) + '/' + items.length + '...';
        const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events/' + ev.id;
        const res = await apiFetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ colorId: wantColor })
        });
        if (res.ok) updated++;
      }
    }
    btn.textContent = original;
    alert(updated > 0 ? 'Listo: se actualizó el color de ' + updated + ' cita(s). Puede tardar unos minutos en reflejarse en el iPhone.' : 'Todas las citas ya tenían el color correcto.');
    refreshCurrentViews();
  } catch (e) {
    btn.textContent = original;
    alert('No se pudo actualizar: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

      const c = byKey[key];
      if (!c.cedula && props.cedula) c.cedula = props.cedula;
      if (!c.address && props.address) c.address = props.address;
      c.count += 1; c.total += price; c.advance += advance;
      c.services[service] = (c.services[service] || 0) + 1;
      const d = new Date(ev.start.dateTime);
      if (d > c.last) c.last = d;
    });
    const clients = Object.values(byKey).sort((a, b) => b.last - a.last);

    // --- Filas contables ---
    const rows = items.map(ev => {
      const parts = (ev.summary || 'Cita').split(' — ');
      const client = parts.length > 1 ? parts[1] : (ev.summary || 'Cliente');
      const service = parts.length > 1 ? parts[0] : 'Otro';
      const props = (ev.extendedProperties && ev.extendedProperties.private) || {};
      const price = parseInt(props.price, 10) || 0;
      const advance = parseInt(props.advance, 10) || 0;
      return {
        date: new Date(ev.start.dateTime), client, service,
        phone: props.phone || '', cedula: props.cedula || '', address: props.address || '',
        price, advance, pending: price - advance, isFuture: new Date(ev.start.dateTime) >= now
      };
    }).sort((a, b) => a.date - b.date);

    const totalFacturado = rows.reduce((s, r) => s + r.price, 0);
    const totalCobrado = rows.reduce((s, r) => s + r.advance, 0);
    const totalPendiente = totalFacturado - totalCobrado;
    const proximas = rows.filter(r => r.isFuture).sort((a, b) => a.date - b.date);
    const porServicio = {};
    rows.forEach(r => { if (!porServicio[r.service]) porServicio[r.service] = { count: 0, total: 0 }; porServicio[r.service].count++; porServicio[r.service].total += r.price; });
    const servicioTop = Object.entries(porServicio).sort((a, b) => b[1].count - a[1].count)[0];

    const wb = new ExcelJS.Workbook();
    wb.creator = 'Daniel D. Makeup — Panel Agenda';
    wb.created = new Date();

    const WINE = 'FF5A1620';
    const WINE_DARK = 'FF14090A';
    const CREAM = 'FFF4EEE5';
    const HEADER_FILL = { type: 'pattern', pattern: 'solid', fgColor: { argb: WINE_DARK } };
    const HEADER_FONT = { color: { argb: 'FFFFFFFF' }, bold: true, size: 11 };
    const MONEY_FMT = '"$"#,##0';
    const THIN = { style: 'thin', color: { argb: 'FFE0E0E0' } };
    const BTN_FILL = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF25D366' } }; // verde WhatsApp
    const BTN_FONT = { color: { argb: 'FFFFFFFF' }, bold: true, size: 10 };

    function styleSheet(ws, headers, colWidths) {
      ws.columns = colWidths.map(w => ({ width: w }));
      const headerRow = ws.addRow(headers);
      headerRow.eachCell(cell => {
        cell.fill = HEADER_FILL;
        cell.font = HEADER_FONT;
        cell.alignment = { vertical: 'middle', horizontal: 'center' };
      });
      headerRow.height = 22;
      ws.views = [{ state: 'frozen', ySplit: 1 }];
    }

    function addWhatsappButton(row, cellIndex, phone) {
      const cell = row.getCell(cellIndex);
      const link = waLink(phone);
      if (link) {
        cell.value = { text: '💬 WhatsApp', hyperlink: link };
        cell.fill = BTN_FILL;
        cell.font = BTN_FONT;
        cell.alignment = { vertical: 'middle', horizontal: 'center' };
      } else {
        cell.value = '—';
        cell.alignment = { vertical: 'middle', horizontal: 'center' };
      }
    }

    // ============ HOJA RESUMEN ============
    const wsR = wb.addWorksheet('Resumen');
    wsR.columns = [{ width: 24 }, { width: 24 }, { width: 24 }, { width: 24 }];
    wsR.mergeCells('A1:D1');
    wsR.getCell('A1').value = 'DANIEL D. MAKEUP — RESUMEN DEL NEGOCIO';
    wsR.getCell('A1').font = { color: { argb: 'FFFFFFFF' }, bold: true, size: 15 };
    wsR.getCell('A1').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: WINE_DARK } };
    wsR.getCell('A1').alignment = { vertical: 'middle', horizontal: 'center' };
    wsR.getRow(1).height = 32;

    function kpiBox(row, col, label, value, color) {
      const cell = wsR.getCell(row, col);
      cell.value = { richText: [{ font: { bold: true, size: 9, color: { argb: 'FFFFFFFF' } }, text: label.toUpperCase() + '\n' }, { font: { bold: true, size: 15, color: { argb: 'FFFFFFFF' } }, text: value }] };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: color } };
      cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
    }
    wsR.getRow(3).height = 46;
    kpiBox(3, 1, 'Facturado', money(totalFacturado), WINE);
    kpiBox(3, 2, 'Cobrado', money(totalCobrado), 'FF2ECC71');
    kpiBox(3, 3, 'Por cobrar', money(totalPendiente), 'FFB23A3A');
    kpiBox(3, 4, 'Clientas', String(clients.length), 'FF6E6259');

    wsR.getCell('A5').value = 'Servicios por tipo';
    wsR.getCell('A5').font = { bold: true, size: 12 };
    wsR.mergeCells('A5:D5');
    const svcHeader = wsR.addRow(['Servicio', 'N° citas', 'Total facturado', '']);
    svcHeader.eachCell((c, i) => { if (i <= 3) { c.fill = HEADER_FILL; c.font = HEADER_FONT; } });
    Object.entries(porServicio).sort((a, b) => b[1].total - a[1].total).forEach(([svc, d], i) => {
      const r = wsR.addRow([svc, d.count, d.total, '']);
      r.getCell(3).numFmt = MONEY_FMT;
      if (i % 2 === 1) r.eachCell((c, idx) => { if (idx <= 3) c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFAF6F0' } }; });
    });

    const nextRowStart = wsR.rowCount + 2;
    wsR.getCell(nextRowStart, 1).value = 'Próximas citas';
    wsR.getCell(nextRowStart, 1).font = { bold: true, size: 12 };
    wsR.mergeCells(nextRowStart, 1, nextRowStart, 4);
    const pHeader = wsR.addRow(['Fecha', 'Cliente', 'Servicio', 'Precio']);
    pHeader.eachCell(c => { c.fill = HEADER_FILL; c.font = HEADER_FONT; });
    proximas.slice(0, 8).forEach((r, i) => {
      const row = wsR.addRow([r.date, r.client, r.service, r.price]);
      row.getCell(1).numFmt = 'dd/mm/yyyy hh:mm';
      row.getCell(4).numFmt = MONEY_FMT;
      if (i % 2 === 1) row.eachCell(c => c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFAF6F0' } });
    });
    if (!proximas.length) wsR.addRow(['No hay citas próximas registradas.']);

    const gastosRowRef = 'SUM(Gastos!C:C)';
    const netoRow = wsR.rowCount + 2;
    wsR.getCell(netoRow, 1).value = 'Gastos registrados';
    wsR.getCell(netoRow, 2).value = { formula: gastosRowRef };
    wsR.getCell(netoRow, 2).numFmt = MONEY_FMT;
    wsR.getCell(netoRow + 1, 1).value = 'Ganancia neta (cobrado − gastos)';
    wsR.getCell(netoRow + 1, 1).font = { bold: true };
    wsR.getCell(netoRow + 1, 2).value = { formula: `${totalCobrado}-${gastosRowRef}` };
    wsR.getCell(netoRow + 1, 2).numFmt = MONEY_FMT;
    wsR.getCell(netoRow + 1, 2).font = { bold: true, color: { argb: WINE } };

    // ============ HOJA CLIENTAS ============
    const wsC = wb.addWorksheet('Clientas');
    styleSheet(wsC, ['Nombre', 'Teléfono', 'Cédula', 'Dirección', 'N° Citas', 'Servicio favorito', 'Total facturado', 'Anticipos', 'Saldo pendiente', 'Última cita', 'Contactar'],
      [26, 16, 14, 26, 10, 18, 16, 14, 16, 14, 14]);
    clients.forEach((c, i) => {
      const fav = Object.entries(c.services).sort((a, b) => b[1] - a[1])[0];
      const row = wsC.addRow([c.name, c.phone, c.cedula, c.address, c.count, fav ? fav[0] : '', c.total, c.advance, c.total - c.advance, c.last, '']);
      row.getCell(7).numFmt = MONEY_FMT;
      row.getCell(8).numFmt = MONEY_FMT;
      row.getCell(9).numFmt = MONEY_FMT;
      row.getCell(9).font = { color: { argb: (c.total - c.advance) > 0 ? 'FFB23A3A' : 'FF2ECC71' }, bold: true };
      row.getCell(10).numFmt = 'dd/mm/yyyy';
      addWhatsappButton(row, 11, c.phone);
      row.eachCell(cell => { cell.border = { bottom: THIN }; if (i % 2 === 1 && cell.col !== 11) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFAFAFA' } }; });
    });
    if (clients.length) {
      wsC.autoFilter = { from: 'A1', to: 'K' + (clients.length + 1) };
      wsC.addConditionalFormatting({
        ref: `I2:I${clients.length + 1}`,
        rules: [{ type: 'iconSet', iconSet: '3TrafficLights1', reverse: true, cfvo: [{ type: 'percent', value: 0 }, { type: 'percent', value: 1 }, { type: 'percent', value: 50 }] }]
      });
    }

    // ============ HOJA CONTABLE ============
    const wsL = wb.addWorksheet('Contable');
    styleSheet(wsL, ['Fecha', 'Mes', 'Cliente', 'Servicio', 'Teléfono', 'Cédula', 'Dirección', 'Precio', 'Anticipo', 'Saldo pendiente', 'Estado', 'Contactar'],
      [13, 12, 22, 18, 16, 14, 24, 13, 13, 15, 13, 14]);
    let tF = 0, tC = 0;
    rows.forEach((r, i) => {
      const estado = r.pending <= 0 ? 'Pagado' : r.advance > 0 ? 'Anticipo' : 'Pendiente';
      const row = wsL.addRow([r.date, r.date.toLocaleDateString('es-CO', { month: 'short', year: 'numeric' }), r.client, r.service, r.phone, r.cedula, r.address, r.price, r.advance, r.pending, estado, '']);
      row.getCell(1).numFmt = 'dd/mm/yyyy';
      row.getCell(8).numFmt = MONEY_FMT;
      row.getCell(9).numFmt = MONEY_FMT;
      row.getCell(10).numFmt = MONEY_FMT;
      row.getCell(11).font = { bold: true, color: { argb: estado === 'Pagado' ? 'FF2ECC71' : estado === 'Anticipo' ? 'FFB8860B' : 'FFB23A3A' } };
      if (r.pending > 0) row.getCell(10).font = { color: { argb: 'FFB23A3A' }, bold: true };
      addWhatsappButton(row, 12, r.phone);
      row.eachCell(cell => { cell.border = { bottom: THIN }; if (i % 2 === 1 && cell.col !== 12) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFAFAFA' } }; });
      tF += r.price; tC += r.advance;
    });
    if (rows.length) {
      wsL.autoFilter = { from: 'A1', to: 'L' + (rows.length + 1) };
    }
    wsL.addRow([]);
    const totalRow = wsL.addRow(['', '', '', '', '', '', 'TOTALES', tF, tC, tF - tC, '', '']);
    totalRow.font = { bold: true };
    [8, 9, 10].forEach(n => totalRow.getCell(n).numFmt = MONEY_FMT);
    totalRow.eachCell(cell => { cell.border = { top: { style: 'medium', color: { argb: WINE_DARK } } }; });

    // ============ HOJA GASTOS ============
    const wsG = wb.addWorksheet('Gastos');
    styleSheet(wsG, ['Fecha', 'Concepto', 'Valor', 'Notas'], [14, 30, 16, 32]);
    ['Ej: Productos, transporte, alquiler de local, publicidad...'].forEach(() => {});
    for (let i = 0; i < 15; i++) {
      const row = wsG.addRow(['', '', '', '']);
      row.getCell(3).numFmt = MONEY_FMT;
      row.eachCell(cell => cell.border = { bottom: THIN });
    }
    const gTotalRow = wsG.addRow(['', 'TOTAL GASTOS', { formula: 'SUM(C2:C16)' }, '']);
    gTotalRow.font = { bold: true };
    gTotalRow.getCell(3).numFmt = MONEY_FMT;
    gTotalRow.eachCell(cell => cell.border = { top: { style: 'medium', color: { argb: WINE_DARK } } });
    wsG.getCell('A18').value = 'Llena esta hoja con tus gastos del mes — el total se resta automáticamente en "Resumen" para calcular tu ganancia neta.';
    wsG.getCell('A18').font = { italic: true, size: 10, color: { argb: 'FF6E6259' } };
    wsG.mergeCells('A18:D18');

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'agenda-daniel-makeup-' + new Date().toISOString().slice(0,10) + '.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('No se pudo exportar: ' + e.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

window.onload = initGoogle;
</script>
</body>
</html>
