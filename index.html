<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Agenda</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #211714;
    --ivory: #FBF7F2;
    --paper: #F3ECE3;
    --paper-line: #E4D8C8;
    --brass: #B08D57;
    --berry: #8C3B4A;
    --berry-soft: #F1DEDE;
    --taupe: #6E5D52;
    --ok: #4C7A5E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ivory);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 760px; margin: 0 auto; padding: 28px 20px 80px; }

  .brand { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; }
  .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .brand .eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--brass);
    display: block;
    margin-bottom: 2px;
    text-decoration: none;
  }
  .brand .eyebrow:hover { color: var(--berry); }
  .status-pill {
    font-size: 12px;
    color: var(--taupe);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #C9A9A9; }
  .dot.on { background: var(--ok); }

  /* --- Connect screen --- */
  .connect-card {
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 14px;
    padding: 40px 32px;
    text-align: center;
  }
  .connect-card .mirror {
    width: 56px; height: 72px;
    margin: 0 auto 18px;
    border: 2px solid var(--brass);
    border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
    position: relative;
  }
  .connect-card .mirror::after {
    content: '';
    position: absolute;
    bottom: -14px; left: 50%;
    transform: translateX(-50%);
    width: 3px; height: 14px;
    background: var(--brass);
  }
  .connect-card p { color: var(--taupe); font-size: 14px; line-height: 1.6; max-width: 380px; margin: 0 auto 22px; }
  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 9px;
    padding: 12px 20px;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.98); }
  .btn-primary { background: var(--ink); color: var(--ivory); }
  .btn-primary:hover { opacity: 0.88; }
  .btn-ghost { background: transparent; color: var(--berry); border: 1px solid var(--berry-soft); }
  .btn-ghost:hover { background: var(--berry-soft); }
  .btn-danger { background: transparent; color: #A94442; font-size: 12px; padding: 6px 10px; }

  /* --- Layout once connected --- */
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .toolbar h2 { font-family: 'Fraunces', serif; font-size: 19px; margin: 0; font-weight: 500; }

  .day-group { margin-bottom: 22px; }
  .day-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--brass);
    font-weight: 600;
    margin-bottom: 8px;
    padding-left: 2px;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .card .info { flex: 1; min-width: 0; }
  .card .time { font-weight: 700; font-size: 13px; color: var(--ink); }
  .card .who { font-size: 14px; margin: 2px 0 0; }
  .card .svc { font-size: 12px; color: var(--taupe); }
  .card .actions { display: flex; gap: 4px; }
  .icon-btn {
    background: transparent; border: none; cursor: pointer;
    font-size: 13px; color: var(--taupe); padding: 6px 8px; border-radius: 6px;
  }
  .icon-btn:hover { background: #EAE0D2; color: var(--ink); }

  .empty { text-align: center; color: var(--taupe); font-size: 14px; padding: 40px 0; }

  /* --- Modal form --- */
  .overlay {
    position: fixed; inset: 0; background: rgba(33,23,20,0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 10;
  }
  .modal {
    background: var(--ivory); border-radius: 16px; padding: 26px;
    width: 100%; max-width: 400px;
    max-height: 88vh; overflow-y: auto;
  }
  .modal h3 { font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 18px; font-weight: 500; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600; color: var(--taupe);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 11px; border-radius: 8px;
    border: 1px solid var(--paper-line); background: var(--paper);
    font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 50px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button { flex: 1; }
  .msg { font-size: 13px; margin-top: 10px; padding: 8px 10px; border-radius: 7px; }
  .msg.err { background: var(--berry-soft); color: var(--berry); }
  .msg.ok { background: #E1EDE5; color: var(--ok); }

  .fab {
    position: fixed; bottom: 26px; right: 50%;
    transform: translateX(220px);
    box-shadow: 0 6px 18px rgba(33,23,20,0.22);
  }
  @media (max-width: 560px) {
    .fab { right: 20px; transform: none; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div>
      <a class="eyebrow" href="https://www.instagram.com/danieldmakeup/" target="_blank" rel="noopener">@danieldmakeup ↗</a>
      <h1>Agenda</h1>
    </div>
    <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">Sin conectar</span></div>
  </div>

  <div id="connectScreen" class="connect-card">
    <div class="mirror"></div>
    <p>Conecta la cuenta de Google Calendar del maquillador para ver y crear citas. Una vez conectado, todo lo que agendes aquí aparece automáticamente en su iPhone.</p>
    <button class="btn-primary" id="connectBtn">Conectar con Google</button>
    <div id="connectMsg"></div>
  </div>

  <div id="mainScreen" style="display:none;">
    <div class="toolbar">
      <h2>Próximas citas</h2>
      <button class="btn-primary" id="newBtnTop">+ Nueva cita</button>
    </div>
    <div id="agendaList"></div>
  </div>
</div>

<button class="btn-primary fab" id="fab" style="display:none;">+ Nueva cita</button>

<div id="overlay" class="overlay" style="display:none;">
  <div class="modal">
    <h3 id="modalTitle">Nueva cita</h3>
    <div class="field">
      <label>Cliente</label>
      <input type="text" id="fClient" placeholder="Nombre del cliente">
    </div>
    <div class="field">
      <label>Servicio</label>
      <select id="fService">
        <option value="Maquillaje social">Maquillaje social</option>
        <option value="Maquillaje de novia">Maquillaje de novia</option>
        <option value="Sesión fotográfica">Sesión fotográfica</option>
        <option value="Curso / asesoría">Curso / asesoría</option>
        <option value="Otro">Otro</option>
      </select>
    </div>
    <div class="row2">
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label>Hora inicio</label>
        <input type="time" id="fTime">
      </div>
    </div>
    <div class="field">
      <label>Duración</label>
      <select id="fDuration">
        <option value="30">30 min</option>
        <option value="45">45 min</option>
        <option value="60" selected>1 hora</option>
        <option value="90">1 h 30 min</option>
        <option value="120">2 horas</option>
        <option value="180">3 horas</option>
      </select>
    </div>
    <div class="field">
      <label>Notas (opcional)</label>
      <textarea id="fNotes" placeholder="Dirección, referencias, acuerdos..."></textarea>
    </div>
    <div id="formMsg"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelBtn">Cancelar</button>
      <button class="btn-primary" id="saveBtn">Guardar cita</button>
    </div>
  </div>
</div>

<script>
const CLIENT_ID = '351176982384-489oulpick1pkgdp229fm984itrbthrm.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly';
const TZ = 'America/Bogota';
const SERVICE_COLORS = {
  'Maquillaje social': '#B08D57',
  'Maquillaje de novia': '#8C3B4A',
  'Sesión fotográfica': '#6E5D52',
  'Curso / asesoría': '#4C7A5E',
  'Otro': '#9B8F82'
};

let accessToken = null;
let tokenClient = null;
let editingEventId = null;

function setStatus(connected) {
  document.getElementById('statusDot').classList.toggle('on', connected);
  document.getElementById('statusText').textContent = connected ? 'Conectado' : 'Sin conectar';
}

function initGoogle() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error) {
        document.getElementById('connectMsg').innerHTML = '<div class="msg err">No se pudo conectar: ' + resp.error + '</div>';
        return;
      }
      accessToken = resp.access_token;
      onConnected();
    }
  });
}

document.getElementById('connectBtn').onclick = () => tokenClient.requestAccessToken();

function onConnected() {
  setStatus(true);
  document.getElementById('connectScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  document.getElementById('fab').style.display = 'block';
  loadEvents();
}

async function apiFetch(url, options = {}) {
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + accessToken });
  let res = await fetch(url, options);
  if (res.status === 401) {
    accessToken = await new Promise((resolve) => {
      tokenClient.callback = (resp) => resolve(resp.access_token);
      tokenClient.requestAccessToken();
    });
    options.headers['Authorization'] = 'Bearer ' + accessToken;
    res = await fetch(url, options);
  }
  return res;
}

async function loadEvents() {
  const list = document.getElementById('agendaList');
  list.innerHTML = '<div class="empty">Cargando citas...</div>';
  const now = new Date();
  const in60 = new Date(now.getTime() + 60 * 24 * 3600 * 1000);
  const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events'
    + '?timeMin=' + now.toISOString()
    + '&timeMax=' + in60.toISOString()
    + '&singleEvents=true&orderBy=startTime&maxResults=100';
  try {
    const res = await apiFetch(url);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Error al cargar');
    renderEvents(data.items || []);
  } catch (e) {
    list.innerHTML = '<div class="empty">No se pudieron cargar las citas.<br>' + e.message + '</div>';
  }
}

function dayLabel(date) {
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  const d = new Date(date); d.setHours(0,0,0,0);
  if (d.getTime() === today.getTime()) return 'Hoy';
  if (d.getTime() === tomorrow.getTime()) return 'Mañana';
  return d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
}

function renderEvents(items) {
  const list = document.getElementById('agendaList');
  if (!items.length) {
    list.innerHTML = '<div class="empty">No hay citas programadas en los próximos 60 días.</div>';
    return;
  }
  const groups = {};
  items.forEach(ev => {
    if (!ev.start || !ev.start.dateTime) return; // skip all-day events
    const d = new Date(ev.start.dateTime);
    const key = d.toDateString();
    if (!groups[key]) groups[key] = { date: d, events: [] };
    groups[key].events.push(ev);
  });
  list.innerHTML = '';
  Object.values(groups).forEach(group => {
    const section = document.createElement('div');
    section.className = 'day-group';
    section.innerHTML = '<div class="day-label">' + dayLabel(group.date) + '</div>';
    group.events.forEach(ev => section.appendChild(renderCard(ev)));
    list.appendChild(section);
  });
}

function renderCard(ev) {
  const start = new Date(ev.start.dateTime);
  const end = new Date(ev.end.dateTime);
  const timeStr = start.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' })
    + ' – ' + end.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' });
  const parts = (ev.summary || 'Cita').split(' — ');
  const service = parts.length > 1 ? parts[0] : 'Otro';
  const client = parts.length > 1 ? parts[1] : (ev.summary || 'Cliente');
  const color = SERVICE_COLORS[service] || SERVICE_COLORS['Otro'];

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <span class="swatch" style="background:${color}"></span>
    <div class="info">
      <div class="time">${timeStr}</div>
      <p class="who">${client}</p>
      <div class="svc">${service}</div>
    </div>
    <div class="actions">
      <button class="icon-btn" data-action="edit">Editar</button>
      <button class="icon-btn" data-action="delete" style="color:#A94442">Eliminar</button>
    </div>
  `;
  card.querySelector('[data-action="edit"]').onclick = () => openModal(ev);
  card.querySelector('[data-action="delete"]').onclick = () => deleteEvent(ev.id);
  return card;
}

function openModal(ev) {
  editingEventId = ev ? ev.id : null;
  document.getElementById('modalTitle').textContent = ev ? 'Editar cita' : 'Nueva cita';
  document.getElementById('formMsg').innerHTML = '';
  if (ev) {
    const parts = (ev.summary || '').split(' — ');
    document.getElementById('fService').value = parts.length > 1 ? parts[0] : 'Otro';
    document.getElementById('fClient').value = parts.length > 1 ? parts[1] : (ev.summary || '');
    document.getElementById('fNotes').value = ev.description || '';
    const start = new Date(ev.start.dateTime);
    const end = new Date(ev.end.dateTime);
    document.getElementById('fDate').value = start.toISOString().slice(0,10);
    document.getElementById('fTime').value = start.toTimeString().slice(0,5);
    document.getElementById('fDuration').value = Math.round((end - start) / 60000);
  } else {
    document.getElementById('fClient').value = '';
    document.getElementById('fService').value = 'Maquillaje social';
    document.getElementById('fNotes').value = '';
    document.getElementById('fDuration').value = '60';
    const now = new Date();
    document.getElementById('fDate').value = now.toISOString().slice(0,10);
    document.getElementById('fTime').value = '09:00';
  }
  document.getElementById('overlay').style.display = 'flex';
}

function closeModal() {
  document.getElementById('overlay').style.display = 'none';
  editingEventId = null;
}

document.getElementById('cancelBtn').onclick = closeModal;
document.getElementById('newBtnTop').onclick = () => openModal(null);
document.getElementById('fab').onclick = () => openModal(null);

document.getElementById('saveBtn').onclick = async () => {
  const client = document.getElementById('fClient').value.trim();
  const service = document.getElementById('fService').value;
  const date = document.getElementById('fDate').value;
  const time = document.getElementById('fTime').value;
  const duration = parseInt(document.getElementById('fDuration').value, 10);
  const notes = document.getElementById('fNotes').value.trim();
  const msg = document.getElementById('formMsg');

  if (!client || !date || !time) {
    msg.innerHTML = '<div class="msg err">Completa cliente, fecha y hora.</div>';
    return;
  }
  const start = new Date(date + 'T' + time + ':00');
  const end = new Date(start.getTime() + duration * 60000);

  const body = {
    summary: service + ' — ' + client,
    description: notes,
    start: { dateTime: start.toISOString(), timeZone: TZ },
    end: { dateTime: end.toISOString(), timeZone: TZ }
  };

  const url = editingEventId
    ? 'https://www.googleapis.com/calendar/v3/calendars/primary/events/' + editingEventId
    : 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
  const method = editingEventId ? 'PATCH' : 'POST';

  try {
    const res = await apiFetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Error al guardar');
    closeModal();
    loadEvents();
  } catch (e) {
    msg.innerHTML = '<div class="msg err">' + e.message + '</div>';
  }
};

async function deleteEvent(id) {
  if (!confirm('¿Eliminar esta cita?')) return;
  try {
    const res = await apiFetch('https://www.googleapis.com/calendar/v3/calendars/primary/events/' + id, { method: 'DELETE' });
    if (!res.ok && res.status !== 410) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error?.message || 'Error al eliminar');
    }
    loadEvents();
  } catch (e) {
    alert('No se pudo eliminar: ' + e.message);
  }
}

window.onload = initGoogle;
</script>
</body>
</html>
